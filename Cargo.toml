[package]
name = "jff"
version = "1.0.20261109"
edition = "2024"
rust-version = "1.89"
authors = ["Rodrigo Quintanar <djperseo@outlook.es>"]
description = "Just for Fun - Encyclopedic Dictionary"
license = "GPL-3.0-only"
repository = "https://github.com/soyperrito/jff"
homepage = "https://github.com/soyperrito/jff"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = "0.13"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
unicodeit = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
