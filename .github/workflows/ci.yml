name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test completions and man page
        run: |
          target/release/jff completions bash > /tmp/jff.bash
          target/release/jff completions zsh > /tmp/_jff
          target/release/jff completions fish > /tmp/jff.fish
          target/release/jff man > /tmp/jff.1
          test -s /tmp/jff.bash
          test -s /tmp/_jff
          test -s /tmp/jff.fish
          test -s /tmp/jff.1
