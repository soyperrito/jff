name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test completions and man page
        run: |
          target/release/jff completions bash > /tmp/jff.bash
          target/release/jff completions zsh > /tmp/_jff
          target/release/jff completions fish > /tmp/jff.fish
          target/release/jff man > /tmp/jff.1
          test -s /tmp/jff.bash
          test -s /tmp/_jff
          test -s /tmp/jff.fish
          test -s /tmp/jff.1

      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build deb and rpm
        env:
          NFPM_BIN: nfpm
        run: |
          chmod +x scripts/build-packages.sh
          scripts/build-packages.sh
          test -s dist/jff_*.deb
          test -s dist/jff-*.rpm

      - name: Verify rpm install in Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist" fedora:44 bash -c '
            set -e
            dnf install -y --setopt=install_weak_deps=False /dist/jff-*.rpm
            jff --version
            test -f /etc/skel/.jff/config.json
            test -f /etc/skel/.jff/themes/dracula.json
          '

      - name: Verify deb install in Debian
        run: |
          docker run --rm -v "$PWD/dist:/dist" debian:stable-slim bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends /dist/jff_*.deb
            jff --version
            test -f /etc/skel/.jff/config.json
            test -f /etc/skel/.jff/themes/dracula.json
          '
